<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font setup for measuring block labels. mockblocks measures with Helvetica Neue,
  which only macOS has, so it is swapped for a font with Helvetica's widths:
  Liberation Sans on Linux, Helvetica or Arial on macOS. The build then points
  the SVGs at Helvetica and Arial, so every machine draws the text at the width
  it was measured with.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>

  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
      <string>Helvetica</string>
      <string>Arial</string>
    </edit>
  </match>
</fontconfig>
