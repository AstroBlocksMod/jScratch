name: Docs

# Checks that the docs build without warnings. Runs only when the docs change.
# Deploying is the Pages workflow's job.

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      - "mockups/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ZENSICAL_VERSION: "0.0.72"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The block mockups are measured with Liberation Sans, see mockups/fonts.conf.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mockups/package-lock.json

      - name: Render block mockups
        working-directory: mockups
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Build docs
        run: uvx "zensical==${ZENSICAL_VERSION}" build --strict
