name: CI

# Lints, tests and assembles everything. Runs only when a file the Gradle build
# reads changes. The Docs workflow checks the docs, and deploying is the Pages
# workflow's job.

on:
  push:
    branches: [main]
    paths: &paths
      - "runtime/**"
      - "sb3js/**"
      - "compiler/**"
      - "compiler-jvm/**"
      - "cli/**"
      - "web/**"
      - "samples/**"
      - "benchmarks/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".editorconfig"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the oldest supported JDK, 25 the one used locally.
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      # emcc for the runtime's sound decoders, pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

