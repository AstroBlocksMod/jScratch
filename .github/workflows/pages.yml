name: Pages

# Builds the docs and the playground into one site: the docs at the root of
# jscratch.hermits.cc and the playground under /playground/. Runs only when a
# file that goes into the site changes: the docs, the block mockups, or a module
# the playground is built from.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mockups/**"
      - "zensical.toml"
      - "web/**"
      - "compiler/**"
      - "sb3js/**"
      - "runtime/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "mise.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZENSICAL_VERSION: "0.0.72"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # emcc for the runtime's sound decoders, pinned in mise.toml.
      - uses: jdx/mise-action@v5

      # The full build lints and runs the end-to-end tests, so a broken
      # compiler never reaches the playground.
      - name: Build and test
        run: ./gradlew build

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mockups/package-lock.json

      # The block mockups are measured with Liberation Sans, see mockups/fonts.conf.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Render block mockups
        working-directory: mockups
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Build docs
        run: uvx "zensical==${ZENSICAL_VERSION}" build --strict

      - name: Combine docs and playground
        run: |
          if [ -e site/playground ]; then
            echo "::error::The docs already have a /playground/ page, which would collide with the playground app."
            exit 1
          fi
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/playground
          cp -R web/build/site/. _site/playground/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
